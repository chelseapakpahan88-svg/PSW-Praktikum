
<!DOCTYPE html>
<html lang="id">
<head>
    <!-- Mengatur karakter teks agar tampil dengan benar -->
    <meta charset="UTF-8">

    <!-- Membuat halaman menyesuaikan ukuran layar -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Judul halaman pada tab browser -->
    <title>Profil Mahasiswa IT Del</title>

    <!-- Menghubungkan file HTML dengan file CSS eksternal -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Bagian header untuk menampilkan judul halaman -->
    <header>
        <h1>Profil Mahasiswa IT Del</h1>
    </header>

    <!-- Bagian utama yang berisi informasi profil -->
    <main class="profil">

        <!-- Menampilkan foto profil mahasiswa -->
        <img src="gambar_1.jpg" alt="Foto Profil Chelsea S Pakpahan">

        <!-- Menampilkan nama lengkap mahasiswa -->
        <p class="nama">Chelsea S Pakpahan</p>

        <!-- Menampilkan NIM mahasiswa -->
        <p class="nim">NIM: 41426018</p>

        <!-- Menampilkan program studi mahasiswa -->
        <p class="prodi">Prodi: DIV TRPL</p>

        <!-- Menampilkan deskripsi singkat mahasiswa -->
        <p class="deskripsi">
            Saya adalah mahasiswa DIV Teknologi Rekayasa
            Perangkat Lunak (TRPL) di IT Del yang tertarik
            pada teknologi dan pemrograman. Saya ingin belajar
            membuat aplikasi dan website.
        </p>
    </main>

    <!-- Bagian footer untuk menampilkan hak cipta -->
    <footer>
        <p>&copy; 2026 Chelsea S Pakpahan</p>
    </footer>
</body>
</html>
